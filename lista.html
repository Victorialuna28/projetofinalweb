<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pacientes</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: antiquewhite;
            padding: 20px;
        }

        h2 {
            color:black
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: beige;
            border-radius: 10px;
            overflow: hidden;

        }
        
        th {
            border: 1px solid pink;
            padding: 10px;
            background-color: antiquewhite;

        }

        button {
            padding: 6px 12px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            color: white ;
        }

        .editar {
            background-color: red;
        }

        .excluir {
            background-color: red;
        }

        button:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <h2>Pacientes Cadastrados</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Tipo</th>
                <th>Plano</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela-corpo"> 
            
        </tbody>
    </table>

    <script>
        
        const params = new URLSearchParams(window.location.search);

        const nome = params.get("nome");
        const cpf = params.get("cpf");
        const telefone = params.get("telefone");
        const tipo = params.get("tipo");
        const plano = params.get("plano");

        if (nome) {
            adicionarLinha(nome,cpf,telefone,tipo,plano);
        }

        function adicionarLinha(nome,cpf,telefone,tipo,plano) {
            const tabela = document.getElementById("tabela-corpo");

            const linha = document.createElement("tr");

            linha.innerHTML = `
            <td>${nome}</td>
            <td>${cpf}</td>
            <td>${telefone}</td>
            <td>${tipo}</td>
            <td>${plano}</td>
            <td>
                 <button class="editar" onclick="editar(this)">Editar</button>
                    <button class="excluir" onclick="excluir(this)">Excluir</button>
                </td>
            `;

            tabela.appendChild(linha);
        }

      
        function editar(botao) {
            const linha = botao.parentNode.parentNode;
            const celulas = linha.querySelectorAll("td");

            const novoNome = prompt("Novo nome:", celulas[0].textContent);
            const novoCpf = prompt("Novo CPF:", celulas[1].textContent);
            const novoTelefone = prompt("Novo Telefone:", celulas[2].textContent);
            const novoTipo = prompt("Novo Tipo:", celulas[3].textContent);
            const novoPlano = prompt("Novo Plano:", celulas[4].textContent);

            if (novoNome) celulas[0].textContent = novoNome;
            if (novoCpf) celulas[1].textContent = novoCpf;
            if (novoTelefone) celulas[2].textContent = novoTelefone;
            if (novoTipo) celulas[3].textContent = novoTipo;
            if (novoPlano) celulas[4].textContent = novoPlano;
        }

        function excluir(botao) {
            if (confirm("Deseja excluir este paciente?")) {
                const linha = botao.parentNode.parentNode;
                linha.remove();
                                       
                    }
                }

        </script>

</body>
</html>
