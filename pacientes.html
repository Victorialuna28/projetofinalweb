<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciente+</title>
    <link rel="stylesheet" href="../css/paciente.css">
</head>
<body onload="carregarPacientes()">

    <h2>Cadastro de Pacientes</h2>
    <form id="formPaciente" onsubmit="salvarPaciente(event)">
        <label for="Nome">Nome:</label>
        <input type="text" id="Nome" required><br>

        <label for="CPF">CPF:</label>
        <input type="text" id="CPF" required><br>

        <label for="Telefone">Telefone:</label>
        <input type="tel" id="Telefone"><br>

        <label for="DataNascimento">Data de Nascimento</label>
        <input type="date" id="DataNascimento" required><br>

        <label for="TipoAtendimento">Tipo de Atendimento</label>
        <select id="TipoAtendimento" onchange="mostrarCampoPlano()" required>
            <option value="">Selecione...</option>
            <option value="Particular">Particular</option>
            <option value="Plano">Plano de Saúde</option>
        </select><br>

        <div id="campoNomePlano" style="display: none;">
            <label for="NomePlano">Qual Plano:</label>
            <input type="text" id="NomePlano"><br>
        </div>

        <label for="Tratamento">Tratamento:</label>
        <input type="text" id="Tratamento" required><br>

        <label for="Endereco">Endereço</label>
        <input type="text" id="Endereco"><br>

        <button type="submit" class="btn-salvar">Salvar Paciente</button>
    </form>
    <a href="tratamentos.html">
        <button type="button">Ver lista de pacientes</button>
    </a>
    <script src="../js/sistema.js"></script>
    <script src="../js/paciente.js"></script>
</body>
</html>
