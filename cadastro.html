<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciente+</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="container">
    <h2>Cadastro de Paciente</h2>

    <form action="lista.html" method="get">
        <label>Nome:</label>
        <input type="text" name="nome" required><br>

        <label>Cpf:</label>
        <input type="tel" name="cpf" required><br>
         
        <label>Telefone:</label>
        <input type="tel" name="telefone" required><br>

        <label>Tipo de Atendimento:</label>
        <select name="tipo" id="tipo" onchange="mostrarPlano()">
            <option value="" selected disabled>Selecione</option>
            <option value="Particular">Particular</option>
            <option value="Plano de Saúde">Plano de Saúde</option>
        </select><br>

        <div id="campoPlano" style="display:none;">
            <label>Qual Plano?</label>
            <input type="text" name="plano">
        </div>

        <button type="submit">Cadastrar</button>
    </form>
    </div>

    <script>
        function mostrarPlano() {
            let tipo = document.getElementById("tipo").value;
            let campo = document.getElementById("campoPlano");

            campo.style.display = (tipo === "Plano de Saúde") ? "block" : "none";
        }
    </script>
</body>
</html>
